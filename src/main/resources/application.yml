server:
  address: 127.0.0.1
  port: ${OJ_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${OJ_DB_URL:jdbc:mysql://127.0.0.1:3306/local_judge}
    username: ${OJ_DB_USER:local_judge}
    password: ${OJ_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true

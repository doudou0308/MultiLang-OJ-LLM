name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root
          MYSQL_DATABASE: local_judge
          MYSQL_USER: local_judge
          MYSQL_PASSWORD: test-local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      OJ_DB_PASSWORD: test-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
      - run: node --check src/main/resources/static/workbench.js
      - name: Exercise the local service
        shell: bash
        run: |
          java -jar target/local-judge-2.0.0-SNAPSHOT.jar > target/smoke.log 2>&1 &
          judge_pid=$!
          trap 'kill "$judge_pid" 2>/dev/null || true; cat target/smoke.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v2/exercises/lantern-count > /dev/null; then
              python3 tools/smoke.py
              exit
            fi
            sleep 1
          done
          exit 1
